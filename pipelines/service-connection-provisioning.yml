# Runs service-connection-provisioning from Azure DevOps itself.
#
# See pipelines/README.md for the pattern every pipeline in this folder follows.
#
# Note what is missing: there is no parameter for the force switches. Overwriting an
# existing connection replaces a credential that cannot be read back, so it is not a
# checkbox on a pipeline form. Whoever needs it runs the command deliberately, from a
# workstation, having decided that is the right thing to do.

trigger: none
pr: none

parameters:
  - name: command
    displayName: Command
    type: string
    default: plan
    values:
      - validate
      - inventory
      - plan
      - smoke
      - apply

  - name: applicationKey
    displayName: Application key (blank means every declared application)
    type: string
    default: ''

  - name: environment
    displayName: Environment (blank means every declared environment)
    type: string
    default: ''
    values:
      - ''
      - DEV
      - QA
      - PROD

  - name: confirmApply
    displayName: Confirm apply
    type: boolean
    default: false

  - name: organizationUrl
    displayName: Organization URL
    type: string
    default: https://dev.azure.com/contoso

  - name: project
    displayName: Team project
    type: string
    default: Platform

variables:
  - group: ado-as-code
  # Holds the SFTP_* credential variables. Kept in its own group so the people who
  # may run a plan are not automatically the people who hold the credentials.
  - group: ado-as-code-connections

pool:
  vmImage: windows-latest

steps:
  - checkout: self
    displayName: Check out the repository

  - powershell: |
      $ErrorActionPreference = 'Stop'

      # The validator and the file writer live in scripts/pipeline/ rather than inline
      # here. They are an injection control, and inline in YAML is the one place in this
      # repository the parse check, PSScriptAnalyzer and Pester all skip - so the same
      # fifty lines sat triplicated across three files with nothing checking that the
      # copies still agreed.
      #
      # Queue-time parameters still arrive as environment variables and are passed on as
      # arguments, never interpolated as a template expression into a script body: a
      # template expression is expanded at compile time, so a free-text parameter is
      # pasted in as SOURCE CODE. Secrets are NOT passed as arguments - the script reads
      # them from this step's environment, because a command line is visible to every
      # other process on the agent.
      .\scripts\pipeline\Write-EnvironmentFile.ps1 -Path .env.pipeline `
        -OrganizationUrl $env:PARAM_ORGANIZATION_URL `
        -Project $env:PARAM_PROJECT `
        -SecretName 'SFTP_APP_ALPHA_DEV_HOST', 'SFTP_APP_ALPHA_DEV_USERNAME', 'SFTP_APP_ALPHA_DEV_PASSWORD', 'SFTP_APP_ALPHA_DEV_PRIVATE_KEY', 'SFTP_APP_ALPHA_QA_HOST', 'SFTP_APP_ALPHA_QA_USERNAME', 'SFTP_APP_ALPHA_QA_PASSWORD', 'SFTP_APP_ALPHA_QA_PRIVATE_KEY', 'SFTP_APP_ALPHA_PROD_HOST', 'SFTP_APP_ALPHA_PROD_USERNAME', 'SFTP_APP_ALPHA_PROD_PASSWORD', 'SFTP_APP_ALPHA_PROD_PRIVATE_KEY', 'SFTP_APP_BETA_DEV_HOST', 'SFTP_APP_BETA_DEV_USERNAME', 'SFTP_APP_BETA_DEV_PASSWORD', 'SFTP_APP_BETA_DEV_PRIVATE_KEY', 'SFTP_APP_BETA_QA_HOST', 'SFTP_APP_BETA_QA_USERNAME', 'SFTP_APP_BETA_QA_PASSWORD', 'SFTP_APP_BETA_QA_PRIVATE_KEY'
    displayName: Materialise the environment file
    env:
      ADO_PAT: $(ADO_PAT)
      PARAM_ORGANIZATION_URL: ${{ parameters.organizationUrl }}
      PARAM_PROJECT: ${{ parameters.project }}
      SFTP_APP_ALPHA_DEV_HOST: $(SFTP_APP_ALPHA_DEV_HOST)
      SFTP_APP_ALPHA_DEV_USERNAME: $(SFTP_APP_ALPHA_DEV_USERNAME)
      SFTP_APP_ALPHA_DEV_PASSWORD: $(SFTP_APP_ALPHA_DEV_PASSWORD)
      SFTP_APP_ALPHA_DEV_PRIVATE_KEY: $(SFTP_APP_ALPHA_DEV_PRIVATE_KEY)
      SFTP_APP_ALPHA_QA_HOST: $(SFTP_APP_ALPHA_QA_HOST)
      SFTP_APP_ALPHA_QA_USERNAME: $(SFTP_APP_ALPHA_QA_USERNAME)
      SFTP_APP_ALPHA_QA_PASSWORD: $(SFTP_APP_ALPHA_QA_PASSWORD)
      SFTP_APP_ALPHA_QA_PRIVATE_KEY: $(SFTP_APP_ALPHA_QA_PRIVATE_KEY)
      SFTP_APP_ALPHA_PROD_HOST: $(SFTP_APP_ALPHA_PROD_HOST)
      SFTP_APP_ALPHA_PROD_USERNAME: $(SFTP_APP_ALPHA_PROD_USERNAME)
      SFTP_APP_ALPHA_PROD_PASSWORD: $(SFTP_APP_ALPHA_PROD_PASSWORD)
      SFTP_APP_ALPHA_PROD_PRIVATE_KEY: $(SFTP_APP_ALPHA_PROD_PRIVATE_KEY)
      SFTP_APP_BETA_DEV_HOST: $(SFTP_APP_BETA_DEV_HOST)
      SFTP_APP_BETA_DEV_USERNAME: $(SFTP_APP_BETA_DEV_USERNAME)
      SFTP_APP_BETA_DEV_PASSWORD: $(SFTP_APP_BETA_DEV_PASSWORD)
      SFTP_APP_BETA_DEV_PRIVATE_KEY: $(SFTP_APP_BETA_DEV_PRIVATE_KEY)
      SFTP_APP_BETA_QA_HOST: $(SFTP_APP_BETA_QA_HOST)
      SFTP_APP_BETA_QA_USERNAME: $(SFTP_APP_BETA_QA_USERNAME)
      SFTP_APP_BETA_QA_PASSWORD: $(SFTP_APP_BETA_QA_PASSWORD)
      SFTP_APP_BETA_QA_PRIVATE_KEY: $(SFTP_APP_BETA_QA_PRIVATE_KEY)

  - powershell: |
      $ErrorActionPreference = 'Stop'

      # Same rule as the previous step: parameters arrive as environment variables.
      # 'command' is re-checked against the closed list even though the parameter
      # declares one, because this script must not depend on that declaration
      # surviving a future edit.
      $command = "$env:PARAM_COMMAND".Trim()
      if ($command -notin @('validate', 'inventory', 'plan', 'smoke', 'apply')) {
        throw "Unsupported command '$command'."
      }

      function Get-OptionalParameter {
        param([Parameter(Mandatory)] [string] $Name, [AllowEmptyString()] [string] $Value, [Parameter(Mandatory)] [string] $Pattern)
        if ([string]::IsNullOrWhiteSpace($Value)) { return '' }
        $trimmed = $Value.Trim()
        if ($trimmed -notmatch $Pattern) {
          throw "Parameter '$Name' has value '$trimmed', which does not match the expected form $Pattern."
        }
        return $trimmed
      }

      $applicationKey = Get-OptionalParameter -Name 'applicationKey' -Value $env:PARAM_APPLICATION_KEY -Pattern '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      $environmentName = Get-OptionalParameter -Name 'environment' -Value $env:PARAM_ENVIRONMENT -Pattern '^[A-Z0-9_]+$'

      $arguments = @{
        Command = $command
        EnvFile = '.env.pipeline'
      }
      if ($applicationKey) { $arguments.ApplicationKey = $applicationKey }
      if ($environmentName) { $arguments.Environment = $environmentName }

      if ($command -eq 'apply') {
        if ("$env:PARAM_CONFIRM_APPLY" -ne 'True') {
          throw "'apply' requires the Confirm apply parameter. Re-run with it ticked, after reviewing a plan."
        }
        $arguments.ConfirmApply = $true
      }

      ./automations/service-connection-provisioning/Invoke-ServiceConnectionProvisioning.ps1 @arguments
    displayName: Run service-connection-provisioning
    env:
      PARAM_COMMAND: ${{ parameters.command }}
      PARAM_APPLICATION_KEY: ${{ parameters.applicationKey }}
      PARAM_ENVIRONMENT: ${{ parameters.environment }}
      PARAM_CONFIRM_APPLY: ${{ parameters.confirmApply }}

      # Mapped explicitly even though Azure DevOps exposes these to every step. An
      # implicit dependency on the agent's environment is one nobody can find by
      # reading this file, and provenance whose source is invisible is provenance
      # nobody trusts. Runtime macros, not template expressions, so they stay data.
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      BUILD_BUILDID: $(Build.BuildId)
      BUILD_REQUESTEDFOR: $(Build.RequestedFor)
      BUILD_DEFINITIONNAME: $(Build.DefinitionName)
      BUILD_SOURCEBRANCH: $(Build.SourceBranch)
  - powershell: |
      $ErrorActionPreference = 'Stop'
      .\scripts\pipeline\Remove-EnvironmentFile.ps1 -Path .env.pipeline
    displayName: Remove the environment file
    # always(), and before the publish step. The file holds ADO_PAT in clear text, and
    # on a self-hosted agent - the case this repository exists for - the workspace
    # survives the run, so a missing cleanup leaves the token on disk between builds.
    # The run this matters most for is the one that threw.
    condition: always()

  - publish: artifacts
    artifact: service-connection-provisioning-$(Build.BuildId)
    displayName: Publish the plan and report
    condition: always()
