# Runs team-provisioning from Azure DevOps itself.
#
# Three things about this file are deliberate and repeat across every pipeline here.
#
# 1. trigger: none. A pipeline that governs the project must not run because
#    somebody pushed a commit. It runs when a person asks for it, having read a plan.
# 2. The command is a parameter with a closed list of values, and `apply` also
#    requires confirmApply. The confirmation exists in two places - here and in the
#    script - because the pipeline UI is where the mistake is easiest to make.
# 3. Secrets reach the script the same way they do on a workstation: as environment
#    variables written into a .env file at run time, from a variable group. The
#    script has no idea whether it is running on an agent or on a laptop.

trigger: none
pr: none

parameters:
  - name: command
    displayName: Command
    type: string
    default: plan
    values:
      - validate
      - inventory
      - plan
      - smoke
      - apply
      - reconcile

  - name: applicationKey
    displayName: Application key (required except for validate and inventory)
    type: string
    default: ''

  - name: confirmApply
    displayName: Confirm apply (required for apply and reconcile)
    type: boolean
    default: false

  - name: organizationUrl
    displayName: Organization URL
    type: string
    default: https://dev.azure.com/contoso

  - name: project
    displayName: Team project
    type: string
    default: Platform

variables:
  # Holds ADO_PAT and the per-application membership variables, all marked secret.
  - group: ado-as-code

pool:
  vmImage: windows-latest

steps:
  - checkout: self
    displayName: Check out the repository

  - powershell: |
      $ErrorActionPreference = 'Stop'

      # The validator and the file writer live in scripts/pipeline/ rather than inline
      # here. They are an injection control, and inline in YAML is the one place in this
      # repository the parse check, PSScriptAnalyzer and Pester all skip - so the same
      # fifty lines sat triplicated across three files with nothing checking that the
      # copies still agreed.
      #
      # Queue-time parameters still arrive as environment variables and are passed on as
      # arguments, never interpolated as a template expression into a script body: a
      # template expression is expanded at compile time, so a free-text parameter is
      # pasted in as SOURCE CODE. Secrets are NOT passed as arguments - the script reads
      # them from this step's environment, because a command line is visible to every
      # other process on the agent.
      .\scripts\pipeline\Write-EnvironmentFile.ps1 -Path .env.pipeline `
        -OrganizationUrl $env:PARAM_ORGANIZATION_URL `
        -Project $env:PARAM_PROJECT
    displayName: Materialise the environment file
    env:
      ADO_PAT: $(ADO_PAT)
      PARAM_ORGANIZATION_URL: ${{ parameters.organizationUrl }}
      PARAM_PROJECT: ${{ parameters.project }}

  - powershell: |
      $ErrorActionPreference = 'Stop'

      # Same rule as the previous step: parameters arrive as environment variables.
      # 'command' is re-checked against the closed list even though the parameter
      # declares one, because this script must not depend on that declaration
      # surviving a future edit.
      $command = "$env:PARAM_COMMAND".Trim()
      if ($command -notin @('validate', 'inventory', 'plan', 'smoke', 'apply', 'reconcile')) {
        throw "Unsupported command '$command'."
      }

      function Get-OptionalParameter {
        param([Parameter(Mandatory)] [string] $Name, [AllowEmptyString()] [string] $Value, [Parameter(Mandatory)] [string] $Pattern)
        if ([string]::IsNullOrWhiteSpace($Value)) { return '' }
        $trimmed = $Value.Trim()
        if ($trimmed -notmatch $Pattern) {
          throw "Parameter '$Name' has value '$trimmed', which does not match the expected form $Pattern."
        }
        return $trimmed
      }

      $applicationKey = Get-OptionalParameter -Name 'applicationKey' -Value $env:PARAM_APPLICATION_KEY -Pattern '^[A-Za-z0-9][A-Za-z0-9_-]*$'

      $arguments = @{
        Command = $command
        EnvFile = '.env.pipeline'
      }
      if ($applicationKey) { $arguments.ApplicationKey = $applicationKey }

      # The gate, stated twice on purpose. The script refuses to write without
      # -ConfirmApply; this refuses to even reach the script without the box ticked.
      if ($command -in @('apply', 'reconcile')) {
        if ("$env:PARAM_CONFIRM_APPLY" -ne 'True') {
          throw "'$command' requires the Confirm apply parameter. Re-run with it ticked, after reviewing a plan."
        }
        $arguments.ConfirmApply = $true
      }

      ./automations/team-provisioning/Invoke-TeamProvisioning.ps1 @arguments
    displayName: Run team-provisioning
    env:
      PARAM_COMMAND: ${{ parameters.command }}
      PARAM_APPLICATION_KEY: ${{ parameters.applicationKey }}
      PARAM_CONFIRM_APPLY: ${{ parameters.confirmApply }}
      # Membership never reaches the repository. It arrives here as a secret
      # variable and is read by name at run time.
      APP_ALPHA_MEMBERS: $(APP_ALPHA_MEMBERS)
      APP_BETA_MEMBERS: $(APP_BETA_MEMBERS)

      # Mapped explicitly even though Azure DevOps exposes these to every step. An
      # implicit dependency on the agent's environment is one nobody can find by
      # reading this file, and provenance whose source is invisible is provenance
      # nobody trusts. Runtime macros, not template expressions, so they stay data.
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      BUILD_BUILDID: $(Build.BuildId)
      BUILD_REQUESTEDFOR: $(Build.RequestedFor)
      BUILD_DEFINITIONNAME: $(Build.DefinitionName)
      BUILD_SOURCEBRANCH: $(Build.SourceBranch)
  - powershell: |
      $ErrorActionPreference = 'Stop'
      .\scripts\pipeline\Remove-EnvironmentFile.ps1 -Path .env.pipeline
    displayName: Remove the environment file
    # always(), and before the publish step. The file holds ADO_PAT in clear text, and
    # on a self-hosted agent - the case this repository exists for - the workspace
    # survives the run, so a missing cleanup leaves the token on disk between builds.
    # The run this matters most for is the one that threw.
    condition: always()

  - publish: artifacts
    artifact: team-provisioning-$(Build.BuildId)
    displayName: Publish the plan, report and receipt
    # always(), because the evidence of a failed apply is the point: the receipt
    # records exactly which operations completed before it stopped.
    condition: always()
