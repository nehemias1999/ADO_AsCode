name: quality gate

# Runs the same command a contributor runs locally: scripts/Invoke-Tests.ps1.
# One entry point for both means "it passed on my machine" and "it passed in CI"
# describe the same set of checks, which is the only way that sentence is useful.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless. Cancel it
# rather than paying for both and reading the wrong one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    # Both editions, in one job, because the difference is not cosmetic: Windows
    # PowerShell 5.1 has no Test-Json -Schema, so it validates configuration with the
    # reduced engine that skips every `pattern` in every schema. Running only 5.1 meant
    # the strong validation path was exercised nowhere; running only 7 would have left
    # the stated support floor unexercised instead.
    #
    # Two literal `shell:` values rather than a matrix: the matrix context is not
    # available to `shell:`, and a matrix over two values would have duplicated the job
    # anyway. Each edition has its own module path, so the tooling is installed twice.
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      # Pinned to a commit, not a tag. A tag is mutable, so `@v4` is a promise that
      # whoever controls the tag will not change what runs in a job holding this
      # repository's token.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Printed per edition, because the answer differs and that difference is the
      # reason both are run: 5.1 reports Test-Json -Schema as False, so it validates
      # configuration with the reduced engine.
      - name: Report the Windows PowerShell 5.1 version under test
        shell: powershell
        run: |
          Write-Host "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          Write-Host "Test-Json -Schema available: $([bool]((Get-Command Test-Json -ErrorAction SilentlyContinue) -and (Get-Command Test-Json).Parameters.ContainsKey('Schema')))"

      - name: Report the PowerShell 7 version under test
        shell: pwsh
        run: |
          Write-Host "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          Write-Host "Test-Json -Schema available: $([bool]((Get-Command Test-Json -ErrorAction SilentlyContinue) -and (Get-Command Test-Json).Parameters.ContainsKey('Schema')))"

      # Exact versions. With a minimum only, a new release of either module turns `main`
      # red without anybody having changed a line - and the first thing you then debug is
      # code that did not move. Raising these is a commit somebody reviews.
      - name: Install the test tooling for Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          # Test-time only. The automations themselves have no dependency beyond
          # PowerShell, which is what lets them run on a locked-down workstation.

      - name: Install the test tooling for PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A separate install: the two editions do not share a module path.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Check the prerequisites without writing anything
        shell: powershell
        run: ./scripts/bootstrap.ps1 -CheckOnly

      - name: Run the quality gate under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/Invoke-Tests.ps1 -TestResultPath "artifacts/test-results/pester-ps51.xml"

      - name: Run the quality gate under PowerShell 7
        shell: pwsh
        run: ./scripts/Invoke-Tests.ps1 -TestResultPath "artifacts/test-results/pester-ps7.xml"

      - name: Publish the test results
        # always(), because the run this is wanted for is the one that failed.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pester-results
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate every automation offline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Proves the claim the guides make: validate needs no credentials. This job
          # has none, so if any of these needed one, the step would fail here.
          ./automations/team-provisioning/Invoke-TeamProvisioning.ps1 -Command validate
          ./automations/variable-group-configuration/Invoke-VariableGroupConfiguration.ps1 -Command validate
          ./automations/service-connection-provisioning/Invoke-ServiceConnectionProvisioning.ps1 -Command validate

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .gitattributes and .editorconfig were declared and verified by nobody. This is
      # the half that can be checked mechanically: re-applying the attributes to the
      # index must be a no-op. If it is not, something was committed with the line
      # endings of whoever committed it, and the next person to touch that file gets a
      # diff of the whole thing.
      - name: Line endings match .gitattributes
        shell: bash
        run: |
          set -euo pipefail
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "These files are committed with line endings .gitattributes does not ask for:"
            git diff --cached --name-only
            echo "Fix with: git add --renormalize . && git commit"
            exit 1
          fi
          echo "Line endings check passed."

      - name: Every document is indexed and every internal link resolves
        shell: bash
        run: |
          set -euo pipefail

          # Findings are collected in a file rather than a variable so the loops can
          # run in this shell. The previous version piped into `while`, which puts the
          # loop body in a subshell: its `exit 1` left only the subshell, and its
          # assignments could not be seen afterwards.
          findings=$(mktemp)

          # An unindexed document is treated as incomplete: nobody finds it, so it
          # rots, and a rotted document is worse than a missing one.
          # -F because a file name contains dots, which are regex wildcards.
          while IFS= read -r doc; do
            name=$(basename "$doc")
            [ "$name" = "README.md" ] && continue
            [ "$name" = "_template.md" ] && continue
            if ! grep -qF -- "$name" docs/README.md; then
              echo "NOT INDEXED: $doc" >> "$findings"
            fi
          done < <(find docs -name '*.md')

          # Relative links, resolved from the linking file.
          while IFS= read -r file; do
            dir=$(dirname "$file")

            # `|| true` is load-bearing. A document with no relative links is normal,
            # but grep exits 1 when it matches nothing, and under `set -o pipefail`
            # that became the pipeline's status - so four ADRs with no links were
            # reported as failures, and the job printed no diagnostic naming them.
            links=$(grep -oE '\]\([^)#][^)]*\)' "$file" || true)
            [ -z "$links" ] && continue

            while IFS= read -r raw; do
              link=${raw#](}
              link=${link%)}
              case "$link" in http*|mailto:*) continue ;; esac
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "BROKEN LINK: $file -> $link" >> "$findings"
              fi
            done <<< "$links"
          done < <(find . -name '*.md' -not -path './.git/*')

          # Every problem, not the first one per file: a second round trip to CI to
          # discover the next broken link is the cost this avoids.
          if [ -s "$findings" ]; then
            cat "$findings"
            echo "Documentation check failed: $(wc -l < "$findings") problem(s)."
            exit 1
          fi
          echo "Documentation check passed."
